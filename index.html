<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Aluminum Calculator & Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #333; }
        #video-container { position: relative; width: 100%; height: 300px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        .controls { display: grid; gap: 10px; }
        label { font-weight: bold; font-size: 0.9em; }
        select, input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
        .result-box { margin-top: 20px; padding: 15px; background: #e7f3ff; border-radius: 5px; border-left: 5px solid #2196F3; }
        .result-box p { margin: 5px 0; font-size: 1.1em; }
        .btn { background: #2196F3; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn:hover { background: #1976D2; }
        #status { font-size: 0.8em; color: #666; margin-bottom: 10px; }
        .settings-panel { background: #eee; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
        .settings-panel label { display: block; margin-top: 10px; font-size: 0.8em; }
        .settings-panel input { width: 100%; }
        .toggle-settings { color: #2196F3; cursor: pointer; text-decoration: underline; font-size: 0.9em; margin-top: 10px; display: block; text-align: center; }
        .history-section { margin-top: 30px; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 0.9em; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Glass Aluminum Tracker</h2>
    
    <div id="status">Loading OpenCV...</div>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <canvas id="canvasOutput" style="display:none;"></canvas>
    <div class="controls">
        <label>Aluminum Series:</label>
        <select id="series" onchange="calculate()">
            <option value="250">Series 38 (Standard)</option>
            <option value="350">Series 798 (Premium)</option>
            <option value="450">Series 900 (Sliding)</option>
            <option value="400">Awning Window</option>
        </select>

        <div style="margin-bottom: 5px;">
            <label>Project Name:</label>
            <input type="text" id="project-name" placeholder="Hal: Kitchen Window">
        </div>

        <div style="margin-bottom: 5px;">
            <label>Client Name:</label>
            <input type="text" id="client-name" placeholder="Hal: Juan Dela Cruz">
        </div>

        <div style="display: flex; gap: 10px;">
            <div>
                <label>Width (inches):</label>
                <input type="number" id="width" value="24" oninput="calculate()">
            </div>
            <div>
                <label>Height (inches):</label>
                <input type="number" id="height" value="24" oninput="calculate()">
            </div>
        </div>

        <button class="btn" onclick="startCamera()">Buksan ang Camera</button>
        <button class="btn" style="background:#4CAF50; margin-top:5px;" onclick="capturePhoto()">Capture Photo</button>
        <button id="lock-btn" class="btn" style="background:#FF9800; margin-top:5px;" onclick="toggleLock()">Lock Measurements</button>
        <a id="download-link" style="display:none;"></a> 

        <span class="toggle-settings" onclick="toggleSettings()">Advanced Detection Settings</span>
        <div id="settings" class="settings-panel">
            <label>Canny Threshold 1 (Low): <span id="v-canny1">50</span></label>
            <input type="range" id="canny1" min="0" max="255" value="50" oninput="updateSettingLabel('canny1', 'v-canny1')">
            
            <label>Canny Threshold 2 (High): <span id="v-canny2">150</span></label>
            <input type="range" id="canny2" min="0" max="255" value="150" oninput="updateSettingLabel('canny2', 'v-canny2')">
            
            <label>Min Card Area: <span id="v-card-area">1000</span></label>
            <input type="range" id="card-area" min="500" max="5000" step="100" value="1000" oninput="updateSettingLabel('card-area', 'v-card-area')">

            <label>Min Glass Area: <span id="v-glass-area">5000</span></label>
            <input type="range" id="glass-area" min="1000" max="20000" step="500" value="5000" oninput="updateSettingLabel('glass-area', 'v-glass-area')">

            <label style="margin-top: 10px; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="auto-calibrate" checked> Auto-calibrate Thresholds
            </label>

            <label style="margin-top: 10px;">Company Logo:</label>
            <input type="file" id="logo-input" accept="image/*" onchange="handleLogoUpload(event)">
            <div id="logo-preview-container" style="margin-top: 5px; display: none; align-items: center; gap: 10px;">
                <img id="logo-preview" src="" style="max-height: 40px; border: 1px solid #ccc;">
                <button onclick="removeLogo()" style="background:#f44336; color:white; border:none; padding:2px 5px; cursor:pointer; font-size: 0.7em;">Remove</button>
            </div>

            <label style="margin-top: 15px; color: #d32f2f;">
                <input type="checkbox" id="debug-mode"> Show Edge Detection (Debug View)
            </label>
        </div>
    </div>

    <div class="result-box">
        <p><strong>Area:</strong> <span id="sqft-display">0</span> sq. ft.</p>
        <p><strong>Series:</strong> <span id="series-display">-</span></p>
        <p style="font-size: 1.3em; color: #2e7d32;"><strong>Total Price: ₱<span id="total-price">0.00</span></strong></p>
        <button class="btn" style="background:#673AB7; margin-top:10px;" onclick="addToHistory()">Save to History</button>
    </div>

    <div class="history-section">
        <h3>Measurement History</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="search-history" placeholder="Maghanap ng Project Name..." oninput="renderHistory()" style="flex: 2; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn" style="background:#f44336; flex: 1;" onclick="clearHistory()">Clear History</button>
            <button class="btn" style="background:#4caf50; flex: 1;" onclick="exportHistoryToCSV()">Export CSV</button>
            <button class="btn" style="background:#2196F3; flex: 1;" onclick="exportHistoryToPDF()">Export PDF</button>
            <button class="btn" style="background:#FF5722; flex: 1;" onclick="sharePDF()">Share/Email PDF</button>
        </div>
        <table id="history-table">
            <thead>
                <tr>
                    <th>Project</th>
                    <th>Size (WxH)</th>
                    <th>Series</th>
                    <th>Sq. Ft.</th>
                    <th>Price</th>
                    <th>Aksyon</th>
                </tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>

        <!-- Adjustment Section for Discount and Tax -->
        <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
            <div>
                <label style="font-size: 0.8em;">Discount (%)</label>
                <input type="number" id="discount-percent" value="0" min="0" oninput="renderHistory()" style="width: 80px; padding: 5px;">
            </div>
            <div>
                <label style="font-size: 0.8em;">Tax / VAT (%)</label>
                <input type="number" id="tax-percent" value="0" min="0" oninput="renderHistory()" style="width: 80px; padding: 5px;">
            </div>
        </div>

        <div id="grand-total-section" style="margin-top: 10px; text-align: right; font-size: 1em; color: #333; padding: 15px; background: #e8f5e9; border-radius: 5px; line-height: 1.6;">
            <div>Subtotal: ₱<span id="subtotal-display">0.00</span></div>
            <div>Discount: -₱<span id="discount-amount-display">0.00</span></div>
            <div>Tax: +₱<span id="tax-amount-display">0.00</span></div>
            <div style="font-size: 1.3em; font-weight: bold; color: #2e7d32; border-top: 1px solid #ccc; margin-top: 5px; pt: 5px;">Grand Total: ₱<span id="grand-total-display">0.00</span></div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script async src="https://docs.opencv.org/4.5.0/opencv.js" onload="onOpenCvReady()"></script>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const canvasOutput = document.getElementById('canvasOutput'); 
    const ctxOutput = canvasOutput.getContext('2d');

    let isCVLoaded = false;
    let animationFrameId; 
    let detectionIntervalId; 

    let isLocked = false;
    let widthBuffer = [];
    let heightBuffer = [];
    
    let signaturePad;

    let lastDetectedCardRect = null;
    let lastDetectedGlassRect = null;
    let lastDetectedRealWidth = 0;
    let lastDetectedRealHeight = 0;

    let historyData = JSON.parse(localStorage.getItem('glassHistory')) || [];

    const CARD_WIDTH_INCHES = 3.375; 

    function onOpenCvReady() {
        document.getElementById('status').innerText = "OpenCV Ready. Handa na ang detection.";
        isCVLoaded = true;
    }

    function toggleSettings() {
        const panel = document.getElementById('settings');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function updateSettingLabel(id, labelId) {
        document.getElementById(labelId).innerText = document.getElementById(id).value;
    }

    function toggleLock() {
        isLocked = !isLocked;
        const btn = document.getElementById('lock-btn');
        if (isLocked) {
            btn.innerText = "Unlock Measurements";
            btn.style.background = "#f44336";
        } else {
            btn.innerText = "Lock Measurements";
            btn.style.background = "#FF9800";
            widthBuffer = []; heightBuffer = []; 
        }
    }

    function handleLogoUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                localStorage.setItem('companyLogo', base64);
                showLogoPreview(base64);
            };
            reader.readAsDataURL(file);
        }
    }

    function showLogoPreview(base64) {
        document.getElementById('logo-preview').src = base64;
        document.getElementById('logo-preview-container').style.display = 'flex';
    }

    function removeLogo() {
        localStorage.removeItem('companyLogo');
        document.getElementById('logo-preview-container').style.display = 'none';
        document.getElementById('logo-input').value = "";
    }

    function drawOverlay() {
        if (video.paused || video.ended) {
            return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!document.getElementById('debug-mode').checked) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (lastDetectedCardRect) {
            ctx.strokeStyle = "blue";
            ctx.lineWidth = 3;
            ctx.strokeRect(lastDetectedCardRect.x, lastDetectedCardRect.y, lastDetectedCardRect.width, lastDetectedCardRect.height);
            ctx.fillStyle = "blue";
            ctx.font = "16px Arial";
            ctx.fillText("Reference Card", lastDetectedCardRect.x, lastDetectedCardRect.y - 5);
        }

        if (lastDetectedGlassRect) {
            ctx.strokeStyle = "#00FF00"; 
            ctx.lineWidth = 4;
            ctx.strokeRect(lastDetectedGlassRect.x, lastDetectedGlassRect.y, lastDetectedGlassRect.width, lastDetectedGlassRect.height);
            ctx.fillStyle = "#00FF00";
            ctx.font = "20px Arial";
            ctx.fillText(`${lastDetectedRealWidth.toFixed(1)}in x ${lastDetectedRealHeight.toFixed(1)}in`, lastDetectedGlassRect.x, lastDetectedGlassRect.y + lastDetectedGlassRect.height + 25);
        }

        requestAnimationFrame(drawOverlay);
    }

    function processDetection() {
        if (!isCVLoaded || video.paused || video.ended) {
            lastDetectedCardRect = null;
            lastDetectedGlassRect = null;
            lastDetectedRealWidth = 0;
            lastDetectedRealHeight = 0;
            return;
        }

        canvasOutput.width = video.videoWidth;
        canvasOutput.height = video.videoHeight;
        ctxOutput.drawImage(video, 0, 0, canvasOutput.width, canvasOutput.height);

        const minCardArea = parseInt(document.getElementById('card-area').value);
        const minGlassArea = parseInt(document.getElementById('glass-area').value);
        const debugMode = document.getElementById('debug-mode').checked;
        const autoCalibrate = document.getElementById('auto-calibrate').checked;

        let src = cv.imread(canvasOutput); 
        let gray = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

        if (autoCalibrate) {
            let meanValue = cv.mean(gray)[0];
            let t2 = Math.min(220, Math.max(60, meanValue * 1.1));
            let t1 = t2 * 0.4;
            document.getElementById('canny1').value = Math.round(t1);
            document.getElementById('canny2').value = Math.round(t2);
            updateSettingLabel('canny1', 'v-canny1');
            updateSettingLabel('canny2', 'v-canny2');
        }

        const canny1 = parseInt(document.getElementById('canny1').value);
        const canny2 = parseInt(document.getElementById('canny2').value);

        cv.medianBlur(gray, gray, 5);
        cv.Canny(gray, gray, canny1, canny2);

        if (debugMode) {
           
            cv.imshow('overlay', gray);
        }

        cv.findContours(gray, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

        let currentCardPixels = 0;
        let currentGlassContour = null;
        let currentMaxArea = 0;

        let foundCard = false;
        let foundGlass = false;

        for (let i = 0; i < contours.size(); ++i) {
            let cnt = contours.get(i);
            let area = cv.contourArea(cnt);
            let peri = cv.arcLength(cnt, true);
            let approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, 0.02 * peri, true); 

            if (approx.rows === 4) {
                let rect = cv.boundingRect(approx);
                let aspectRatio = rect.width / rect.height;

                if (aspectRatio > 1.3 && aspectRatio < 1.8 && area > minCardArea) {
                    currentCardPixels = rect.width;
                    lastDetectedCardRect = rect; 
                    foundCard = true;
                }
                
                if (area > currentMaxArea && area > minGlassArea) {
                    currentMaxArea = area;
                    currentGlassContour = rect;
                    foundGlass = true;
                }
            }
            approx.delete();
        }

        if (foundCard && foundGlass) {
            let ppi = currentCardPixels / CARD_WIDTH_INCHES;
            let realWidth = currentGlassContour.width / ppi;
            let realHeight = currentGlassContour.height / ppi;

            widthBuffer.push(realWidth);
            heightBuffer.push(realHeight);
            if (widthBuffer.length > 5) widthBuffer.shift();
            if (heightBuffer.length > 5) heightBuffer.shift();

            let avgW = widthBuffer.reduce((a, b) => a + b) / widthBuffer.length;
            let avgH = heightBuffer.reduce((a, b) => a + b) / heightBuffer.length;

            if (!isLocked) {
                document.getElementById('width').value = avgW.toFixed(1);
                document.getElementById('height').value = avgH.toFixed(1);
                calculate();
            }

            lastDetectedGlassRect = currentGlassContour;
            lastDetectedRealWidth = realWidth;
            lastDetectedRealHeight = realHeight;
        } else {
          
            lastDetectedCardRect = null;
            lastDetectedGlassRect = null;
            lastDetectedRealWidth = 0;
            lastDetectedRealHeight = 0;
      
        }

        src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.addEventListener('loadedmetadata', () => {
                drawOverlay();
             
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (detectionIntervalId) clearInterval(detectionIntervalId);

                video.play(); 
                animationFrameId = requestAnimationFrame(drawOverlay); 
                detectionIntervalId = setInterval(processDetection, 200); 
                calculate();
            });
        } catch (err) {
            alert("Hindi ma-access ang camera: " + err);
        }
    }

    function capturePhoto() {
        if (!video.srcObject) {
            alert("Walang camera feed. Buksan muna ang camera.");
            return;
        }

        const dataURL = canvas.toDataURL('image/png');
        const downloadLink = document.getElementById('download-link');
        downloadLink.href = dataURL;
        downloadLink.download = `glass_measurement_${new Date().toISOString()}.png`;
        downloadLink.click(); 
    }

    function addToHistory() {
        const projName = document.getElementById('project-name').value.trim() || "N/A";
        const wVal = document.getElementById('width').value;
        const hVal = document.getElementById('height').value;
        const unitPrice = parseFloat(document.getElementById('series').value);

        const newItem = {
            project: projName,
            w: wVal,
            h: hVal,
            unitPrice: unitPrice,
            size: `${wVal}" x ${hVal}"`,
            series: document.getElementById('series-display').innerText,
            sqft: document.getElementById('sqft-display').innerText,
            price: `₱${document.getElementById('total-price').innerText}`,
            timestamp: new Date().toLocaleString()
        };

        historyData.unshift(newItem);
        localStorage.setItem('glassHistory', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        const tableBody = document.getElementById('history-body');
        const searchQuery = document.getElementById('search-history').value.toLowerCase();
        tableBody.innerHTML = '';

        let subtotal = 0;

        historyData.forEach((item, index) => {
            if (item.project.toLowerCase().includes(searchQuery)) {
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td>${item.project || 'N/A'}</td>
                    <td>${item.size}</td>
                    <td>${item.series}</td>
                    <td>${item.sqft}</td>
                    <td>${item.price}</td>
                    <td style="display: flex; gap: 4px;">
                        <button onclick="editHistoryItem(${index})" style="background:#FF9800; color:white; border:none; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:0.8em;">Edit</button>
                        <button onclick="deleteHistoryItem(${index})" style="background:#f44336; color:white; border:none; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:0.8em;">Bura</button>
                    </td>
                `;
                
                const priceValue = parseFloat(item.price.replace(/[^\d.]/g, '')) || 0;
                subtotal += priceValue;
            }
        });

        const discountPercent = parseFloat(document.getElementById('discount-percent').value) || 0;
        const taxPercent = parseFloat(document.getElementById('tax-percent').value) || 0;

        const discountAmount = subtotal * (discountPercent / 100);
        const taxableAmount = subtotal - discountAmount;
        const taxAmount = taxableAmount * (taxPercent / 100);
        const grandTotal = taxableAmount + taxAmount;

        localStorage.setItem('discountRate', discountPercent);
        localStorage.setItem('taxRate', taxPercent);

        document.getElementById('subtotal-display').innerText = subtotal.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('discount-amount-display').innerText = discountAmount.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('tax-amount-display').innerText = taxAmount.toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('grand-total-display').innerText = grandTotal.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    function clearHistory() {
        if (confirm("Sigurado ka bang gusto mong burahin ang lahat ng records?")) {
            historyData = [];
            localStorage.removeItem('glassHistory');
            renderHistory();
        }
    }

    function editHistoryItem(index) {
        const item = historyData[index];
        const newProject = prompt("Edit Project Name:", item.project);
        if (newProject === null) return;

        const newW = prompt("Edit Width (inches):", item.w || "");
        if (newW === null) return;

        const newH = prompt("Edit Height (inches):", item.h || "");
        if (newH === null) return;

        const w = parseFloat(newW) || 0;
        const h = parseFloat(newH) || 0;
        
        let uPrice = item.unitPrice;
        if (!uPrice) {
            const currentSqft = parseFloat(item.sqft) || 1;
            const currentPrice = parseFloat(item.price.replace(/[^\d.]/g, '')) || 0;
            uPrice = currentPrice / currentSqft;
        }

        const sqft = (w * h) / 144;
        const total = sqft * uPrice;

        item.project = newProject.trim() || "N/A";
        item.w = w; item.h = h; item.unitPrice = uPrice;
        item.size = `${w}" x ${h}"`;
        item.sqft = sqft.toFixed(2);
        item.price = `₱${total.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

        localStorage.setItem('glassHistory', JSON.stringify(historyData));
        renderHistory();
    }

    function deleteHistoryItem(index) {
        if (confirm("Sigurado ka bang gusto mong burahin ang record na ito?")) {
            historyData.splice(index, 1);
            localStorage.setItem('glassHistory', JSON.stringify(historyData));
            renderHistory();
        }
    }

    function generatePDF(isSharing = false) {
        if (historyData.length === 0) return alert("Walang data na pwedeng i-export.");
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const clientName = document.getElementById('client-name').value.trim() || "Valued Client";
        const companyLogo = localStorage.getItem('companyLogo');

        let signatureImg = null;
        if (!signaturePad.isEmpty()) {
            signatureImg = signaturePad.toDataURL('image/png');
        }
        
        let startY = 20;
        if (companyLogo) {
            doc.addImage(companyLogo, 'PNG', 14, 10, 30, 30);
            startY = 45;
        }

        doc.setFontSize(22);
        doc.setTextColor(33, 150, 243);
        doc.text("QUOTATION INVOICE", companyLogo ? 50 : 14, 20);
        
        doc.setFontSize(10);
        doc.setTextColor(0);
        doc.text("Glass & Aluminum Specialist", companyLogo ? 50 : 14, 30);
        doc.text("Contact: your@email.com | 09XX-XXX-XXXX", companyLogo ? 50 : 14, 35);
        
        doc.setDrawColor(200);
        doc.line(14, startY - 5, 196, startY - 5);
        
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text("BILL TO:", 14, startY + 5);
        doc.setFont(undefined, 'normal');
        doc.text(clientName, 14, startY + 11);
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 150, startY + 5);
        
        const tableData = historyData.map(item => [
            item.project,
            item.size,
            item.series,
            item.sqft,
            item.price.replace('₱', 'PHP ')
        ]);
        
        doc.autoTable({
            head: [['Project', 'Size (WxH)', 'Series', 'Sq. Ft.', 'Price']],
            body: tableData,
            startY: startY + 20,
            theme: 'striped',
            headStyles: { fillColor: [33, 150, 243] }
        });
        
        const finalY = doc.lastAutoTable.finalY || 65;
        const summaryX = 140;
        let summaryY = finalY + 10;

        doc.setFontSize(10);
        doc.text(`Subtotal: PHP ${document.getElementById('subtotal-display').innerText}`, summaryX, summaryY);
        summaryY += 7;
        doc.text(`Discount: -PHP ${document.getElementById('discount-amount-display').innerText}`, summaryX, summaryY);
        summaryY += 7;
        doc.text(`Tax/VAT: +PHP ${document.getElementById('tax-amount-display').innerText}`, summaryX, summaryY);
        
        summaryY += 10;
        doc.setFontSize(14);
        doc.setFont(undefined, 'bold');
        doc.text(`GRAND TOTAL: PHP ${document.getElementById('grand-total-display').innerText}`, summaryX, summaryY);
        
        let sigY = summaryY + 20;
     
        if (sigY + 40 > doc.internal.pageSize.getHeight()) {
            doc.addPage();
            sigY = 20;
        }

        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        doc.text("Conforme / Accepted By:", 14, sigY);
        
        if (signatureImg) {
            doc.addImage(signatureImg, 'PNG', 14, sigY + 2, 50, 20);
        }
        
        doc.line(14, sigY + 25, 74, sigY + 25); 
        doc.text(clientName, 14, sigY + 30);
        doc.text("Customer Signature over Printed Name", 14, sigY + 35);

        if (isSharing) {
            return doc.output('blob');
        } else {
            doc.save(`Quotation_${clientName.replace(/\s+/g, '_')}.pdf`);
        }
    }

    function exportHistoryToCSV() {
        if (historyData.length === 0) return alert("Walang data na pwedeng i-export.");
        
        let csvContent = "\uFEFFProject,Size (WxH),Series,Sq. Ft.,Price\n"; 
        historyData.forEach(item => {
            csvContent += `"${item.project || 'N/A'}","${item.size}","${item.series}","${item.sqft}","${item.price}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `glass_calculator_history_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportHistoryToPDF() {
        generatePDF(false);
    }

    async function sharePDF() {
        const clientName = document.getElementById('client-name').value.trim() || "Valued Client";
        const pdfBlob = generatePDF(true);
        const file = new File([pdfBlob], `Quotation_${clientName.replace(/\s+/g, '_')}.pdf`, { type: 'application/pdf' });

        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Glass Quotation',
                    text: `Narito ang quotation para kay ${clientName}.`,
                    files: [file]
                });
            } catch (err) {
                console.error("Share failed:", err);
            }
        } else {
            alert("Ang 'Share' feature ay hindi supported sa browser na ito. I-download na lang ang PDF at i-email manually.");
        }
    }

    function calculate() {
        const w = parseFloat(document.getElementById('width').value) || 0;
        const h = parseFloat(document.getElementById('height').value) || 0;
        const seriesSelect = document.getElementById('series');
        const pricePerSqFt = parseFloat(seriesSelect.value);
        const seriesName = seriesSelect.options[seriesSelect.selectedIndex].text;

        const sqft = (w * h) / 144;
        const total = sqft * pricePerSqFt;

        document.getElementById('sqft-display').innerText = sqft.toFixed(2);
        document.getElementById('series-display').innerText = seriesName;
        document.getElementById('total-price').innerText = total.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    document.getElementById('discount-percent').value = localStorage.getItem('discountRate') || 0;
    document.getElementById('tax-percent').value = localStorage.getItem('taxRate') || 0;
    const savedLogo = localStorage.getItem('companyLogo');
    if (savedLogo) showLogoPreview(savedLogo);

    renderHistory();
    calculate();

    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.getElementById('signature-pad');
        signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgb(255, 255, 255)'
        });

        function resizeSignatureCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear();
        }
        window.onresize = resizeSignatureCanvas;
        resizeSignatureCanvas();
    });

    function clearSignature() {
        signaturePad.clear();
    }
</script>

<style>
    .signature-container { margin-top: 20px; text-align: left; background: #fff; padding: 15px; border-radius: 5px; border: 1px solid #ddd; }
    #signature-pad { border: 1px dashed #ccc; border-radius: 4px; width: 100%; height: 150px; cursor: crosshair; touch-action: none; }
</style>
<script>
   
    const historySection = document.querySelector('.history-section');
    const totalSection = document.getElementById('grand-total-section');
    
    const sigUI = document.createElement('div');
    sigUI.className = 'signature-container';
    sigUI.innerHTML = `
        <label style="font-weight:bold; font-size: 0.9em;">Customer Signature:</label>
        <canvas id="signature-pad"></canvas>
        <button class="btn" style="background:#607D8B; margin-top:5px; padding: 5px 10px; font-size: 0.8em; width: auto;" onclick="clearSignature()">Clear Signature</button>
    `;
    
    historySection.insertBefore(sigUI, totalSection);
</script>
