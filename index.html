<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass & Aluminum Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        #video-container { position: relative; width: 100%; max-width: 500px; margin: auto; overflow: hidden; border-radius: 12px; }
        #video { width: 100%; height: auto; }
        #overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 2px dashed #00ff00;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scan-line {
            position: absolute;
            width: 100%; height: 2px;
            background: rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 10px #00ff00;
            animation: scan 2s infinite linear;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #60a5fa;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-white p-4">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4 text-center text-blue-400">Glass Tech Scanner</h1>
        
        <div id="video-container" class="bg-black">
            <video id="video" autoplay playsinline></video>
            <div id="overlay" class="transition-all duration-300" style="width: 200px; height: 150px;">
                <div class="scan-line"></div>
                <span class="text-[10px] text-green-400 absolute -bottom-5">ALIGN FRAME HERE</span>
            </div>
           
            <div id="status" class="absolute top-2 right-2 flex items-center bg-black/50 px-2 py-1 rounded text-[10px]">
                <div id="status-spinner" class="loading-spinner w-3 h-3 mr-2"></div>
                <span id="status-text">Loading AI...</span>
            </div>
        </div>

        <div class="mt-6 space-y-4 bg-gray-800 p-4 rounded-xl shadow-lg">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 uppercase">Series Type</label>
                    <select id="series" class="w-full bg-gray-700 p-2 rounded mt-1 outline-none border border-gray-600 focus:border-blue-500">
                        <option value="900">Series 900</option>
                        <option value="798">Series 798</option>
                        <option value="38">Series 38</option>
                        <option value="awning">Awning</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 uppercase">Calibration (px to inch)</label>
                    <input type="number" id="ratio" value="10" class="w-full bg-gray-700 p-2 rounded mt-1 outline-none border border-gray-600">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs text-gray-400 uppercase">Adjust Scan Box Size</label>
                <input type="range" id="widthAdjust" min="50" max="300" value="200" class="w-full">
                <input type="range" id="heightAdjust" min="50" max="400" value="150" class="w-full">
            </div>

            <hr class="border-gray-700">

            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-gray-700 p-2 rounded">
                    <p class="text-xs text-gray-400">Width x Height</p>
                    <p id="dimensions" class="font-bold text-lg">0" x 0"</p>
                </div>
                <div class="bg-gray-700 p-2 rounded">
                    <p class="text-xs text-gray-400">Square Feet</p>
                    <p id="sqft" class="font-bold text-lg text-yellow-400">0.00</p>
                </div>
            </div>

            <div class="bg-blue-600/20 p-4 rounded-xl text-center border border-blue-500/30">
                <p class="text-xs uppercase font-semibold text-blue-300">Current Item Price</p>
                <p id="totalPrice" class="text-2xl font-black">₱ 0.00</p>
            </div>

            <div class="flex gap-2">
                <button id="addItemBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl transition-colors text-sm">
                    ADD ITEM
                </button>
                <button id="saveBtn" class="flex-1 bg-green-600 hover:bg-green-700 font-bold py-3 rounded-xl transition-colors text-sm">
                    SAVE QUOTE
                </button>
            </div>
        </div>

        <details class="mt-4 bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-md">
            <summary class="text-xs text-gray-400 uppercase cursor-pointer select-none">Unit Prices (PHP/sqft)</summary>
            <div class="grid grid-cols-2 gap-3 mt-3">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] w-8">900:</span>
                    <input type="number" data-key="900" class="price-setting bg-gray-700 p-1 rounded text-xs w-full outline-none focus:border-blue-500 border border-transparent">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] w-8">798:</span>
                    <input type="number" data-key="798" class="price-setting bg-gray-700 p-1 rounded text-xs w-full outline-none focus:border-blue-500 border border-transparent">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] w-8">38:</span>
                    <input type="number" data-key="38" class="price-setting bg-gray-700 p-1 rounded text-xs w-full outline-none focus:border-blue-500 border border-transparent">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] w-8">Awn:</span>
                    <input type="number" data-key="awning" class="price-setting bg-gray-700 p-1 rounded text-xs w-full outline-none focus:border-blue-500 border border-transparent">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] w-8 text-blue-400 font-bold">Tax %:</span>
                    <input type="number" id="taxInput" class="bg-gray-700 p-1 rounded text-xs w-full outline-none focus:border-blue-500 border border-transparent" step="0.1" value="0">
                </div>
            </div>
        </details>

        <div id="pendingContainer" class="hidden mt-4 bg-blue-900/10 p-4 rounded-xl border border-blue-500/30">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase text-blue-400 tracking-wider italic">Current Project Items</h3>
                <button onclick="clearPending()" class="text-[10px] text-red-400 bg-red-400/10 px-2 py-1 rounded">Reset List</button>
            </div>
            <div id="pendingList" class="space-y-2 mb-4"></div>
            <div class="flex justify-between items-center border-t border-blue-500/30 pt-3">
                <span class="text-xs font-bold text-gray-400">GRAND TOTAL:</span>
                <span id="grandTotal" class="text-2xl font-black text-white">₱ 0.00</span>
            </div>
        </div>

        <div class="mt-8">
            <h2 class="text-lg font-bold mb-3 flex justify-between items-center">
                <span>Saved Quotes</span>
                <div class="flex gap-3">
                    <button onclick="exportToCSV()" class="text-xs text-blue-400 font-normal underline">Export CSV</button>
                    <button onclick="clearQuotes()" class="text-xs text-red-400 font-normal underline">Clear All</button>
                </div>
            </h2>
            <div class="mb-4">
                <input type="text" id="searchInput" placeholder="Search series or date..." 
                       class="w-full bg-gray-700 border border-gray-600 p-2 rounded-lg text-sm outline-none focus:border-blue-500 transition-colors">
            </div>
            <div id="quotesList" class="space-y-3 pb-10">
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const seriesSelect = document.getElementById('series');
        const widthAdjust = document.getElementById('widthAdjust');
        const heightAdjust = document.getElementById('heightAdjust');
        const addItemBtn = document.getElementById('addItemBtn');
        const saveBtn = document.getElementById('saveBtn');
        const quotesList = document.getElementById('quotesList');
        const statusText = document.getElementById('status-text');
        const statusSpinner = document.getElementById('status-spinner');
        
        const dimText = document.getElementById('dimensions');
        const sqftText = document.getElementById('sqft');
        const priceText = document.getElementById('totalPrice');
        const ratioInput = document.getElementById('ratio');

        const TM_MODEL_URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID/"; 

        let model = null;
        
        const DB_NAME = "GlassTechDB";
        const STORE_NAME = "quotes";

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "id" });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject("IndexedDB failed to load");
            });
        }

        async function getQuotesFromDB() {
            const db = await initDB();
            return new Promise((resolve) => {
                const transaction = db.transaction(STORE_NAME, "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result.reverse());
            });
        }

        async function saveQuoteToDB(quote) {
            const db = await initDB();
            const transaction = db.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).add(quote);
        }

        async function deleteQuoteFromDB(id) {
            const db = await initDB();
            const transaction = db.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).delete(id);
        }

        async function clearAllQuotesFromDB() {
            const db = await initDB();
            const transaction = db.transaction(STORE_NAME, "readwrite");
            transaction.objectStore(STORE_NAME).clear();
        }

        let prices = JSON.parse(localStorage.getItem('glass_prices')) || {
            "900": 450,    
            "798": 380,   
            "38": 280,     
            "awning": 320  
        };
        let taxRate = parseFloat(localStorage.getItem('glass_tax')) || 0;
        let pendingItems = [];

        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                video.srcObject = stream;
                loadModel();
            } catch (err) {
                alert("Camera access denied or not available.");
            }
        }

        async function loadModel() {
            try {
                const modelURL = TM_MODEL_URL + "model.json";
                const metadataURL = TM_MODEL_URL + "metadata.json";
                
                model = await tmImage.load(modelURL, metadataURL);
                statusText.innerText = "AI Ready";
                statusSpinner.classList.add('hidden');
                detectFrame();
            } catch (err) {
                statusText.innerText = "AI Error (Check URL)";
                console.error("Failed to load model", err);
            }
        }

        async function detectFrame() {
            if (!model) return;
            
            const predictions = await model.predict(video);
            
            predictions.sort((a, b) => b.probability - a.probability);
            const topResult = predictions[0];

            if (topResult && topResult.probability > 0.85) {
                statusText.innerText = `Type: ${topResult.className}`;
                
                const mappedValue = topResult.className.toLowerCase().replace(/\s/g, '');
                if ([...seriesSelect.options].some(opt => opt.value === mappedValue)) {
                    seriesSelect.value = mappedValue;
                    calculate();
                }
            }

            requestAnimationFrame(detectFrame);
        }

        function calculate() {
            const pxToInch = parseFloat(ratioInput.value) || 10;
            
            const widthInches = (overlay.offsetWidth / pxToInch).toFixed(1);
            const heightInches = (overlay.offsetHeight / pxToInch).toFixed(1);
            
            const sqft = (widthInches * heightInches) / 144;
            
            const selectedSeries = seriesSelect.value;
            const unitPrice = prices[selectedSeries];
            const subtotal = sqft * unitPrice;
            const total = subtotal * (1 + taxRate / 100);

            dimText.innerText = `${widthInches}" x ${heightInches}"`;
            sqftText.innerText = sqft.toFixed(2);
            priceText.innerText = `₱ ${total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function addItem() {
            const pxToInch = parseFloat(ratioInput.value) || 10;
            const widthInches = (overlay.offsetWidth / pxToInch).toFixed(1);
            const heightInches = (overlay.offsetHeight / pxToInch).toFixed(1);
            const sqft = (widthInches * heightInches) / 144;
            const selectedSeries = seriesSelect.value;
            const unitPrice = prices[selectedSeries];
            const itemPrice = (sqft * unitPrice) * (1 + taxRate / 100);

            pendingItems.push({
                series: seriesSelect.options[seriesSelect.selectedIndex].text,
                dims: `${widthInches}" x ${heightInches}"`,
                sqft: sqft.toFixed(2),
                price: itemPrice
            });

            renderPending();
        }

        function renderPending() {
            const container = document.getElementById('pendingContainer');
            const list = document.getElementById('pendingList');
            const totalDisplay = document.getElementById('grandTotal');

            if (pendingItems.length > 0) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }

            let grandTotal = 0;
            list.innerHTML = pendingItems.map((item, index) => {
                grandTotal += item.price;
                return `
                    <div class="flex justify-between items-center text-[11px] bg-black/30 p-2 rounded border border-gray-700">
                        <span><b class="text-blue-400">${item.series}</b>: ${item.dims}</span>
                        <div class="flex items-center gap-2">
                            <span class="font-mono">₱${item.price.toFixed(2)}</span>
                            <button onclick="removePending(${index})" class="text-red-400 font-bold hover:scale-125 transition-transform px-1">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalDisplay.innerText = `₱ ${grandTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        }

        window.removePending = (index) => {
            pendingItems.splice(index, 1);
            renderPending();
        };

        window.clearPending = () => {
            pendingItems = [];
            renderPending();
        };

        async function saveQuote() {
            if (pendingItems.length === 0) addItem();

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const screenshot = canvas.toDataURL('image/jpeg', 0.92);

            const totalSqft = pendingItems.reduce((sum, item) => sum + parseFloat(item.sqft), 0);
            const totalPrice = pendingItems.reduce((sum, item) => sum + item.price, 0);

            const quote = {
                id: Date.now(),
                series: pendingItems.length === 1 ? pendingItems[0].series : `${pendingItems.length} Items Mixed`,
                dims: pendingItems.length === 1 ? pendingItems[0].dims : "Multi-item Quote",
                sqft: totalSqft.toFixed(2),
                price: `₱ ${totalPrice.toLocaleString(undefined, {minimumFractionDigits: 2})}`,
                date: new Date().toLocaleTimeString(),
                img: screenshot
            };
            
            await saveQuoteToDB(quote);
            clearPending();
            renderQuotes();
        }

        async function exportToCSV() {
            const quotes = await getQuotesFromDB();
            if (quotes.length === 0) {
                alert("No quotes to export.");
                return;
            }

            const headers = ["Date", "Series", "Dimensions", "Square Feet", "Total Price"];
            const csvRows = [
                headers.join(','),
                ...quotes.map(q => `"${q.date}","${q.series}","${q.dims}","${q.sqft}","${q.price.replace('₱ ', '')}"`)
            ];

            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Glass_Quotes_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function renderQuotes(filter = "") {
            const allQuotes = await getQuotesFromDB();
            const filteredQuotes = allQuotes.filter(q => 
                q.series.toLowerCase().includes(filter.toLowerCase()) || 
                q.date.toLowerCase().includes(filter.toLowerCase())
            );

            quotesList.innerHTML = filteredQuotes.map(q => `
                <div class="bg-gray-800 border-l-4 border-blue-500 p-3 rounded-r flex items-center shadow">
                    ${q.img ? `<img src="${q.img}" class="w-16 h-16 rounded object-cover mr-3 border border-gray-700 shadow-sm">` : ''}
                    <div class="flex-1">
                        <p class="text-[10px] text-gray-400 uppercase tracking-wider">${q.date} - ${q.series}</p>
                        <p class="font-bold">${q.dims} (${q.sqft} sqft)</p>
                    </div>
                    <div class="text-right ml-2 flex flex-col items-end gap-1 min-w-fit">
                        <p class="text-blue-400 font-bold">${q.price}</p>
                        <div class="flex gap-2">
                            <button onclick="shareQuote(${q.id})" class="text-[10px] text-green-400 hover:underline">Share</button>
                            <button onclick="downloadImage('${q.img}', 'quote-${q.id}.jpg')" class="text-[10px] text-blue-300 hover:underline">Download</button>
                            <button onclick="deleteQuote(${q.id})" class="text-[10px] text-red-400 hover:underline">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function dataUrlToFile(dataUrl, fileName) {
            const res = await fetch(dataUrl);
            const blob = await res.blob();
            return new File([blob], fileName, { type: 'image/jpeg' });
        }

        window.shareQuote = async (id) => {
            const quotes = await getQuotesFromDB();
            const quote = quotes.find(q => q.id === id);
            
            if (!quote || !navigator.share) {
                alert("Sharing is not supported on this browser or device.");
                return;
            }

            try {
                const file = await dataUrlToFile(quote.img, `quote-${id}.jpg`);
                const shareData = {
                    title: `Glass Quote - ${quote.series}`,
                    text: `Glass Tech Quote\nSeries: ${quote.series}\nDimensions: ${quote.dims}\nPrice: ${quote.price}`,
                    files: [file]
                };

                if (navigator.canShare && navigator.canShare(shareData)) {
                    await navigator.share(shareData);
                } else {
                    await navigator.share({ title: shareData.title, text: shareData.text });
                }
            } catch (err) {
                console.error("Share error:", err);
            }
        };

        window.downloadImage = (dataUrl, filename) => {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            link.click();
        };

        window.deleteQuote = async (id) => {
            await deleteQuoteFromDB(id);
            renderQuotes();
        };

        window.clearQuotes = async () => {
            if(confirm("Clear all history?")) {
                await clearAllQuotesFromDB();
                renderQuotes();
            }
        };

        widthAdjust.addEventListener('input', (e) => {
            overlay.style.width = `${e.target.value}px`;
            calculate();
        });

        heightAdjust.addEventListener('input', (e) => {
            overlay.style.height = `${e.target.value}px`;
            calculate();
        });

        document.querySelectorAll('.price-setting').forEach(input => {
            const key = input.dataset.key;
            input.value = prices[key];
            input.addEventListener('change', (e) => {
                prices[key] = parseFloat(e.target.value) || 0;
                localStorage.setItem('glass_prices', JSON.stringify(prices));
                calculate();
            });
        });

        const taxInput = document.getElementById('taxInput');
        taxInput.value = taxRate;
        taxInput.addEventListener('change', (e) => {
            taxRate = parseFloat(e.target.value) || 0;
            localStorage.setItem('glass_tax', taxRate);
            calculate();
        });

        seriesSelect.addEventListener('change', calculate);
        ratioInput.addEventListener('input', calculate);
        addItemBtn.addEventListener('click', addItem);
        saveBtn.addEventListener('click', saveQuote);
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderQuotes(e.target.value);
        });

        setupCamera();
        calculate();
        renderQuotes();
    </script>
</body>
</html>
